<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Systems Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import the Fira Sans font -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Persona card area -->
        <div id="persona-card"></div>

        <!-- Solution cards area -->
        <div id="solution-cards">
            <!-- Cards will be dynamically added here -->
        </div>

        <!-- Score area -->
        <div id="score-container">
            <div class="score-background"></div>
            <div class="score-label">Score:</div>
            <div class="score-value" id="score-value">0</div>
        </div>
    </div>

    <!-- Modal structure -->
    <div id="try-again-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <p>Oops! Try again!</p>
        </div>
    </div>

    <!-- Link to JavaScript -->
    <script src="script.js"></script>
</body>
</html>
